version: '3.8'

services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code
      - .:/app
      # Persist node_modules and pnpm store
      - node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
      # Exclude nested node_modules to avoid conflicts
      - /app/packages/core/node_modules
      - /app/packages/react/node_modules
      - /app/apps/demo/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true
    command: sh -c "yes | pnpm install && pnpm --filter @flowcn/core build && pnpm --filter @flowcn/react build && pnpm dev"

  prod:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

volumes:
  node_modules:
  pnpm_store:
